name: Release

on:
  push:
    branches:
      - main
    paths:
      - CHANGELOG.md
      - package.json
      - package-lock.json
      - server/package.json
      - web/package.json
      - tui/package.json
      - desktop/package.json
      - cli/package.json
  workflow_dispatch:
    inputs:
      version:
        description: Existing package version to publish or recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      manual: ${{ steps.plan.outputs.manual }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a release version change
        id: plan
        env:
          RELEASE_BEFORE_SHA: ${{ github.event.before }}
          RELEASE_REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/release-plan.mjs
      - name: Verify the release PR branch
        if: ${{ github.event_name == 'push' && steps.plan.outputs.release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -eu
          RELEASE_HEAD=$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GH_REPO}/commits/${GITHUB_SHA}/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.ref // ""'
          )
          case "$RELEASE_HEAD" in
            release/"$RELEASE_VERSION"|release/v"$RELEASE_VERSION"|release-"$RELEASE_VERSION"|release-v"$RELEASE_VERSION"|*/release-"$RELEASE_VERSION"|*/release-v"$RELEASE_VERSION")
              ;;
            *)
              echo "Version changes must be merged from a dedicated release branch; got '${RELEASE_HEAD}'." >&2
              exit 1
              ;;
          esac

  verify:
    needs: plan
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.12'
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen
      - run: npm run release:check

  tag:
    needs: [plan, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create or verify the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_MANUAL: ${{ needs.plan.outputs.manual }}
        run: |
          set -eu
          if EXISTING=$(
            gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object.sha' 2>/dev/null
          ); then
            git fetch --force origin \
              "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            RESOLVED=$(git rev-list -n 1 "$RELEASE_TAG")
            if [ "$RESOLVED" != "$GITHUB_SHA" ]; then
              if [ "$RELEASE_MANUAL" = "true" ]; then
                echo "Recovering the existing ${RELEASE_TAG} at ${RESOLVED}."
              else
                echo "${RELEASE_TAG} already points to ${RESOLVED}, not ${GITHUB_SHA}." >&2
                exit 1
              fi
            fi
          else
            gh api \
              --method POST \
              "repos/${GH_REPO}/git/refs" \
              -f "ref=refs/tags/${RELEASE_TAG}" \
              -f "sha=${GITHUB_SHA}"
          fi

  npm:
    needs: [plan, tag]
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip the upstream npm package name
        run: |
          echo "This independent repository must not publish npm package qwen-audio-agent."
          echo "That name belongs to https://github.com/QwenAudio/qwen-audio-agent"

  macos:
    needs: [plan, tag]
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Validate macOS release credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu
          MISSING=""
          for NAME in \
            CSC_LINK \
            CSC_KEY_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID
          do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then
              MISSING="${MISSING} ${NAME}"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "Missing GitHub Actions secrets:${MISSING}" >&2
            exit 1
          fi
      - name: Build, sign and notarize universal macOS DMG
        run: npm run desktop:build -- --universal --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-dmg
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.blockmap
            dist/desktop/latest-mac.yml
          if-no-files-found: error

  windows:
    needs: [plan, tag]
    if: ${{ needs.plan.outputs.release == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Build Windows NSIS installer
        run: npm run desktop:build:win
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe
          path: |
            dist/desktop/*.exe
            dist/desktop/*.blockmap
            dist/desktop/latest.yml
          if-no-files-found: error

  github-release:
    needs: [plan, tag, npm, macos, windows]
    if: ${{ always() && needs.npm.result == 'success' && (needs.macos.result == 'success' || needs.macos.result == 'skipped') && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.macos.result == 'success' }}
        with:
          name: macos-dmg
          path: artifacts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.windows.result == 'success' }}
        with:
          name: windows-exe
          path: artifacts
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --verify-tag --generate-notes
      - name: Upload macOS desktop artifacts
        if: ${{ needs.macos.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" artifacts/* --clobber
